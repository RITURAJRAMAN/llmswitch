[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "llmswitch-sdk"
version = "0.1.2"
description = "One Python client for chat completions, embeddings and the Responses API across OpenAI, Azure OpenAI, Azure AI Foundry, Anthropic and Vertex AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Rituraj Raman" }]
keywords = ["llm", "openai", "azure", "anthropic", "vertex-ai", "embeddings", "chat-completions", "responses-api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.14.1,<3",
    "openai>=3.36.1,<4.0.0",
    "anthropic>=2.1.0,<3",
    "azure-ai-inference==1.0.0b9",
    "aiohttp>=3.14.5,<4.0.0",
    "google-genai>=2.32.0,<3",
    "tiktoken>=0.14.0,<0.15",
]

[project.urls]
Homepage = "https://github.com/RITURAJRAMAN/llmswitch"
Repository = "https://github.com/RITURAJRAMAN/llmswitch"
Issues = "https://github.com/RITURAJRAMAN/llmswitch/issues"
Changelog = "https://github.com/RITURAJRAMAN/llmswitch/blob/main/CHANGELOG.md"

# Every provider SDK is a core dependency. These extras are kept, empty, so existing
# install commands such as pip install "llmswitch-sdk[vertexai]" keep working.
[project.optional-dependencies]
anthropic = []
azure-foundry = []
vertexai = []
redis = [
    "redis>=8.1.0,<9",
]
all = [
    "llmswitch-sdk[redis]",
]
dev = [
    "build>=1.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "twine>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["llmswitch*"]

[tool.setuptools.package-data]
llmswitch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["llmswitch"]
branch = true

[tool.coverage.report]
fail_under = 60
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
files = ["src/llmswitch"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

# The provider modules wrap SDK response types that are unions, and their annotations are
# still thin. They are not type-checked yet; everything else in the package is.
[[tool.mypy.overrides]]
module = [
    "llmswitch.providers.openai_provider",
    "llmswitch.providers.azureopenai_provider",
    "llmswitch.providers.azurefoundry_provider",
    "llmswitch.providers.anthropic_provider",
    "llmswitch.providers.vertexai_provider",
]
ignore_errors = true
