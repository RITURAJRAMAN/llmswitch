[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "llmswitch-sdk"
version = "0.1.0"
description = "One Python client for chat completions and embeddings across OpenAI, Azure OpenAI, Azure AI Foundry, Anthropic and Vertex AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Rituraj Raman" }]
keywords = ["llm", "openai", "azure", "anthropic", "vertex-ai", "embeddings", "chat-completions"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.14.1,<3",
    "openai>=3.36.1,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/RITURAJRAMAN/llmswitch"
Repository = "https://github.com/RITURAJRAMAN/llmswitch"
Issues = "https://github.com/RITURAJRAMAN/llmswitch/issues"
Changelog = "https://github.com/RITURAJRAMAN/llmswitch/blob/main/CHANGELOG.md"

[project.optional-dependencies]
anthropic = [
    "anthropic>=2.1.0,<3",
]
azure-foundry = [
    "azure-ai-inference==1.0.0b9",
    "aiohttp>=3.14.5,<4.0.0",
]
vertexai = [
    "google-genai>=2.32.0,<3",
]
all = [
    "llmswitch-sdk[anthropic,azure-foundry,vertexai]",
]
dev = [
    "build>=1.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "twine>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["llmswitch*"]

[tool.setuptools.package-data]
llmswitch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
