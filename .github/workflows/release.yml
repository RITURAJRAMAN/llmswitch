name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

# Third-party actions are pinned to commit hashes. Dependabot proposes updates.
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject malformed tags
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a valid vX.Y.Z version tag"
            exit 1
          fi

  test:
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras and dev tools
        run: python -m pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Test with coverage floor
        run: pytest --cov

  test-core-only:
    # Runs without the agentic extra, to prove the core package does not need it.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install package with the redis extra and dev tools, without the agentic extra
        run: python -m pip install -e ".[redis,dev]"
      - name: Confirm the optional dependency is not installed
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('langchain_core') is not None)"
      - name: Test without the agentic extra
        run: python -m pytest -q -p no:cacheprovider

  build:
    needs: [test, test-core-only]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify package version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$declared" != "$expected" ]]; then
            echo "::error::pyproject.toml version '$declared' does not match tag '$GITHUB_REF_NAME'"
            exit 1
          fi
      - name: Verify wheel contents
        run: |
          python -m zipfile -l dist/*.whl | grep -q "llmswitch/py.typed"
          python -m zipfile -l dist/*.whl | grep -q "llmswitch/core/sync_client.py"
          if python -m zipfile -l dist/*.whl | grep -Eq "(^|/)(tests/|\.env|local/)"; then
            echo "::error::Wheel contains test or secret paths"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    # Installs the built wheel in a clean environment and runs the offline tests against it,
    # from a directory where the source tree cannot be imported.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl pytest pytest-asyncio
      - name: Run the offline tests against the installed wheel
        run: |
          mkdir "$RUNNER_TEMP/run"
          cp -r tests pyproject.toml "$RUNNER_TEMP/run/"
          cd "$RUNNER_TEMP/run"
          "$RUNNER_TEMP/smoke/bin/python" -m pytest -q -p no:cacheprovider tests

  publish-pypi:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llmswitch-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing, no API token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: false

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
