name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject malformed tags
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a valid vX.Y.Z version tag"
            exit 1
          fi

  test:
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with all extras and dev tools
        run: python -m pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify package version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$declared" != "$expected" ]]; then
            echo "::error::pyproject.toml version '$declared' does not match tag '$GITHUB_REF_NAME'"
            exit 1
          fi
      - name: Verify wheel contents
        run: |
          python -m zipfile -l dist/*.whl | grep -q "llmswitch/py.typed"
          python -m zipfile -l dist/*.whl | grep -q "llmswitch/core/sync_client.py"
          if python -m zipfile -l dist/*.whl | grep -Eq "(^|/)(tests/|\.env|local/)"; then
            echo "::error::Wheel contains test or secret paths"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llmswitch-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing, no API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
