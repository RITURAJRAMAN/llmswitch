name: Publish to TestPyPI

# Manual dry run before a production release. Uses the same trusted-publishing
# setup as release.yml, with a separate TestPyPI trusted publisher and environment.
on:
  workflow_dispatch:

permissions: {}

# Third-party actions are pinned to commit hashes. Dependabot proposes updates.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package with all extras and dev tools
        run: python -m pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Test with coverage floor
        run: pytest --cov

  publish-testpypi:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/llmswitch-sdk/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
