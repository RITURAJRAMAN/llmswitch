name: Publish to TestPyPI

# Manual dry run before a production release. Uses the same trusted-publishing
# setup as release.yml, with a separate TestPyPI trusted publisher and environment.
on:
  workflow_dispatch:

permissions: {}

# Third-party actions are pinned to commit hashes. Dependabot proposes updates.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package with all extras and dev tools
        run: python -m pip install -e ".[all,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Test with coverage floor
        run: pytest --cov

  publish-testpypi:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/llmswitch-sdk/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
